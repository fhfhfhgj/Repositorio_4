<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro Completo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .form-container .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        /* Estilos generales para inputs */
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="number"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.valid {
            border-color: #27ae60;
            background-color: #f0faf4;
        }

        .form-group input.invalid {
            border-color: #e74c3c;
            background-color: #fef5f5;
        }

        /* Estilos para checkbox y radio */
        .checkbox-group,
        .radio-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }

        .checkbox-group input[type="checkbox"],
        .radio-group input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-options {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }

        .radio-options .radio-group {
            margin-bottom: 8px;
        }

        .radio-options .radio-group:last-child {
            margin-bottom: 0;
        }

        /* Mensajes de error */
        .error-message {
            color: #e74c3c;
            font-size: 0.85em;
            margin-top: 5px;
            display: none;
            animation: shake 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Botón de envío */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Mensaje de éxito */
        .success-message {
            display: none;
            background: #27ae60;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            animation: slideIn 0.5s ease;
        }

        .success-message h3 {
            margin-bottom: 10px;
        }

        .success-message .data-summary {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-top: 10px;
        }

        .success-message .data-summary p {
            margin: 5px 0;
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-container {
                padding: 25px;
            }
            
            .form-container h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>📝 Formulario de Registro</h1>
        <p class="subtitle">Todos los campos marcados con <span style="color: #e74c3c;">*</span> son obligatorios</p>

        <!-- 
            FORMULARIO COMPLETO CON DIFERENTES TIPOS DE INPUT
            - Incluye validaciones HTML5 nativas
            - Validación adicional con JavaScript
        -->
        <form id="registration-form" novalidate>
            
            <!-- 
                CAMPO DE TEXTO: Nombre
                type="text" - Permite ingresar texto
                required - Campo obligatorio
                minlength="3" - Mínimo 3 caracteres (validación HTML5)
            -->
            <div class="form-group">
                <label for="nombre">
                    Nombre Completo <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    required 
                    minlength="3"
                    placeholder="Ej: Juan Pérez"
                    autocomplete="name"
                >
                <div class="error-message" id="nombre-error"></div>
            </div>

            <!-- 
                CAMPO DE TEXTO: Dirección
                type="text" - Otro ejemplo de campo de texto
            -->
            <div class="form-group">
                <label for="direccion">
                    Dirección <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="direccion" 
                    name="direccion"
                    required 
                    minlength="5"
                    placeholder="Ej: Calle Principal 123, Ciudad"
                    autocomplete="street-address"
                >
                <div class="error-message" id="direccion-error"></div>
            </div>

            <!-- 
                CAMPO DE EMAIL
                type="email" - Validación automática de formato
                El navegador valida que tenga formato "nombre@dominio.com"
            -->
            <div class="form-group">
                <label for="email">
                    Correo Electrónico <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required 
                    placeholder="nombre@dominio.com"
                    autocomplete="email"
                >
                <div class="error-message" id="email-error"></div>
            </div>

            <!-- 
                CAMPOS DE CONTRASEÑA
                type="password" - Oculta los caracteres ingresados
                Se incluyen dos campos para confirmación
            -->
            <div class="form-group">
                <label for="password">
                    Contraseña <span class="required">*</span>
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    required 
                    minlength="8"
                    placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password"
                >
                <div class="error-message" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">
                    Confirmar Contraseña <span class="required">*</span>
                </label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    name="confirm-password"
                    required 
                    minlength="8"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password"
                >
                <div class="error-message" id="confirm-password-error"></div>
            </div>

            <!-- 
                CAMPO DE NÚMERO: Edad
                type="number" - Solo permite valores numéricos
                min="18" y max="120" - Rango permitido
            -->
            <div class="form-group">
                <label for="edad">
                    Edad <span class="required">*</span>
                </label>
                <input 
                    type="number" 
                    id="edad" 
                    name="edad"
                    required 
                    min="18" 
                    max="120"
                    placeholder="Ej: 25"
                >
                <div class="error-message" id="edad-error"></div>
            </div>

            <!-- 
                CAMPO DE FECHA: Fecha de Nacimiento
                type="date" - Muestra un selector de fecha
                max - Fecha máxima permitida (hoy)
            -->
            <div class="form-group">
                <label for="fecha-nacimiento">
                    Fecha de Nacimiento <span class="required">*</span>
                </label>
                <input 
                    type="date" 
                    id="fecha-nacimiento" 
                    name="fecha-nacimiento"
                    required
                    max="2006-12-31"
                >
                <div class="error-message" id="fecha-error"></div>
            </div>

            <!-- 
                RADIO BUTTONS: Género
                type="radio" - Permite seleccionar solo una opción
                name="genero" - Agrupa los radios (mismo name)
            -->
            <div class="form-group">
                <label>
                    Género <span class="required">*</span>
                </label>
                <div class="radio-options">
                    <div class="radio-group">
                        <input 
                            type="radio" 
                            id="masculino" 
                            name="genero" 
                            value="masculino"
                            required
                        >
                        <label for="masculino">Masculino</label>
                    </div>
                    <div class="radio-group">
                        <input 
                            type="radio" 
                            id="femenino" 
                            name="genero" 
                            value="femenino"
                        >
                        <label for="femenino">Femenino</label>
                    </div>
                    <div class="radio-group">
                        <input 
                            type="radio" 
                            id="otro" 
                            name="genero" 
                            value="otro"
                        >
                        <label for="otro">Otro</label>
                    </div>
                </div>
                <div class="error-message" id="genero-error"></div>
            </div>

            <!-- 
                CHECKBOX: Términos y condiciones
                type="checkbox" - Permite seleccionar o deseleccionar
                required - Debe estar marcado para enviar
            -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input 
                        type="checkbox" 
                        id="terminos" 
                        name="terminos"
                        required
                    >
                    <label for="terminos">
                        Acepto los términos y condiciones <span class="required">*</span>
                    </label>
                </div>
                <div class="error-message" id="terminos-error"></div>
            </div>

            <!-- 
                CHECKBOX ADICIONAL: Suscripción newsletter
                No es obligatorio, ejemplo de checkbox opcional
            -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input 
                        type="checkbox" 
                        id="newsletter" 
                        name="newsletter"
                    >
                    <label for="newsletter">
                        Deseo recibir noticias y ofertas por email
                    </label>
                </div>
            </div>

            <!-- Botón de envío -->
            <button type="submit" class="submit-btn">
                ✅ Registrar Usuario
            </button>

            <!-- Mensaje de éxito -->
            <div class="success-message" id="success-message">
                <h3>🎉 ¡Registro Exitoso!</h3>
                <p>Tus datos han sido enviados correctamente</p>
                <div class="data-summary" id="data-summary"></div>
            </div>
        </form>
    </div>

    <script>
        /*
            ============================================
            SCRIPT DE VALIDACIÓN COMPLETO
            Incluye:
            - Validaciones HTML5 nativas
            - Validación adicional con JavaScript
            - Verificación de contraseñas coincidentes
            - Mensajes de error personalizados
        ============================================
        */

        // Obtener el formulario y todos los campos
        const form = document.getElementById('registration-form');
        const nombre = document.getElementById('nombre');
        const direccion = document.getElementById('direccion');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm-password');
        const edad = document.getElementById('edad');
        const fechaNacimiento = document.getElementById('fecha-nacimiento');
        const generoRadios = document.getElementsByName('genero');
        const terminos = document.getElementById('terminos');
        const successMessage = document.getElementById('success-message');
        const dataSummary = document.getElementById('data-summary');

        /*
            FUNCIONES DE VALIDACIÓN INDIVIDUAL
            Cada función retorna true si el campo es válido
        */

        // Validar nombre (texto)
        function validateNombre() {
            const value = nombre.value.trim();
            const errorElement = document.getElementById('nombre-error');
            
            if (!value) {
                showError(nombre, errorElement, 'El nombre es obligatorio');
                return false;
            }
            if (value.length < 3) {
                showError(nombre, errorElement, 'El nombre debe tener al menos 3 caracteres');
                return false;
            }
            // Verificar que solo contenga letras y espacios
            if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(value)) {
                showError(nombre, errorElement, 'El nombre solo debe contener letras');
                return false;
            }
            
            clearError(nombre, errorElement);
            return true;
        }

        // Validar dirección (texto)
        function validateDireccion() {
            const value = direccion.value.trim();
            const errorElement = document.getElementById('direccion-error');
            
            if (!value) {
                showError(direccion, errorElement, 'La dirección es obligatoria');
                return false;
            }
            if (value.length < 5) {
                showError(direccion, errorElement, 'La dirección debe tener al menos 5 caracteres');
                return false;
            }
            
            clearError(direccion, errorElement);
            return true;
        }

        // Validar email
        function validateEmail() {
            const value = email.value.trim();
            const errorElement = document.getElementById('email-error');
            
            if (!value) {
                showError(email, errorElement, 'El correo electrónico es obligatorio');
                return false;
            }
            
            // Validación de formato con expresión regular
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(value)) {
                showError(email, errorElement, 'Ingresa un correo electrónico válido (ejemplo@dominio.com)');
                return false;
            }
            
            clearError(email, errorElement);
            return true;
        }

        // Validar contraseña
        function validatePassword() {
            const value = password.value;
            const errorElement = document.getElementById('password-error');
            
            if (!value) {
                showError(password, errorElement, 'La contraseña es obligatoria');
                return false;
            }
            if (value.length < 8) {
                showError(password, errorElement, 'La contraseña debe tener al menos 8 caracteres');
                return false;
            }
            // Validar que tenga al menos un número y una letra
            if (!/[a-zA-Z]/.test(value) || !/[0-9]/.test(value)) {
                showError(password, errorElement, 'La contraseña debe contener letras y números');
                return false;
            }
            
            clearError(password, errorElement);
            return true;
        }

        // Validar confirmación de contraseña
        function validateConfirmPassword() {
            const value = confirmPassword.value;
            const errorElement = document.getElementById('confirm-password-error');
            
            if (!value) {
                showError(confirmPassword, errorElement, 'Debes confirmar tu contraseña');
                return false;
            }
            
            // Verificar que las contraseñas coincidan
            if (value !== password.value) {
                showError(confirmPassword, errorElement, 'Las contraseñas no coinciden');
                return false;
            }
            
            clearError(confirmPassword, errorElement);
            return true;
        }

        // Validar edad (número)
        function validateEdad() {
            const value = edad.value;
            const errorElement = document.getElementById('edad-error');
            
            if (!value) {
                showError(edad, errorElement, 'La edad es obligatoria');
                return false;
            }
            if (value < 18) {
                showError(edad, errorElement, 'Debes ser mayor de 18 años');
                return false;
            }
            if (value > 120) {
                showError(edad, errorElement, 'Ingresa una edad válida');
                return false;
            }
            
            clearError(edad, errorElement);
            return true;
        }

        // Validar fecha de nacimiento
        function validateFecha() {
            const value = fechaNacimiento.value;
            const errorElement = document.getElementById('fecha-error');
            
            if (!value) {
                showError(fechaNacimiento, errorElement, 'La fecha de nacimiento es obligatoria');
                return false;
            }
            
            // Verificar que sea mayor de 18 años
            const fechaNac = new Date(value);
            const hoy = new Date();
            let edadCalculada = hoy.getFullYear() - fechaNac.getFullYear();
            const mes = hoy.getMonth() - fechaNac.getMonth();
            
            if (mes < 0 || (mes === 0 && hoy.getDate() < fechaNac.getDate())) {
                edadCalculada--;
            }
            
            if (edadCalculada < 18) {
                showError(fechaNacimiento, errorElement, 'Debes ser mayor de 18 años');
                return false;
            }
            
            clearError(fechaNacimiento, errorElement);
            return true;
        }

        // Validar género (radio)
        function validateGenero() {
            const errorElement = document.getElementById('genero-error');
            let seleccionado = false;
            
            for (let radio of generoRadios) {
                if (radio.checked) {
                    seleccionado = true;
                    break;
                }
            }
            
            if (!seleccionado) {
                errorElement.textContent = 'Selecciona un género';
                errorElement.classList.add('show');
                return false;
            }
            
            errorElement.textContent = '';
            errorElement.classList.remove('show');
            return true;
        }

        // Validar términos (checkbox)
        function validateTerminos() {
            const errorElement = document.getElementById('terminos-error');
            
            if (!terminos.checked) {
                errorElement.textContent = 'Debes aceptar los términos y condiciones';
                errorElement.classList.add('show');
                return false;
            }
            
            errorElement.textContent = '';
            errorElement.classList.remove('show');
            return true;
        }

        /*
            FUNCIONES AUXILIARES PARA MOSTRAR/OCULTAR ERRORES
        */

        function showError(inputElement, errorElement, message) {
            inputElement.classList.add('invalid');
            inputElement.classList.remove('valid');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearError(inputElement, errorElement) {
            inputElement.classList.remove('invalid');
            inputElement.classList.add('valid');
            errorElement.textContent = '';
            errorElement.classList.remove('show');
        }

        /*
            VALIDACIÓN EN TIEMPO REAL
            Se ejecuta mientras el usuario interactúa con los campos
        */

        nombre.addEventListener('input', validateNombre);
        direccion.addEventListener('input', validateDireccion);
        email.addEventListener('input', validateEmail);
        password.addEventListener('input', () => {
            validatePassword();
            // Revalidar confirmación si ya tiene contenido
            if (confirmPassword.value) {
                validateConfirmPassword();
            }
        });
        confirmPassword.addEventListener('input', validateConfirmPassword);
        edad.addEventListener('input', validateEdad);
        fechaNacimiento.addEventListener('change', validateFecha);
        
        // Validar radio buttons al cambiar
        for (let radio of generoRadios) {
            radio.addEventListener('change', validateGenero);
        }
        
        terminos.addEventListener('change', validateTerminos);

        /*
            MANEJO DEL ENVÍO DEL FORMULARIO
            Validación final antes de enviar
        */
        form.addEventListener('submit', function(event) {
            // Prevenir el envío por defecto
            event.preventDefault();
            
            console.log('🔍 Iniciando validación del formulario...');
            
            // Ejecutar todas las validaciones
            const isValidNombre = validateNombre();
            const isValidDireccion = validateDireccion();
            const isValidEmail = validateEmail();
            const isValidPassword = validatePassword();
            const isValidConfirmPassword = validateConfirmPassword();
            const isValidEdad = validateEdad();
            const isValidFecha = validateFecha();
            const isValidGenero = validateGenero();
            const isValidTerminos = validateTerminos();
            
            // Verificar si todas las validaciones pasaron
            const isFormValid = 
                isValidNombre && 
                isValidDireccion && 
                isValidEmail && 
                isValidPassword && 
                isValidConfirmPassword && 
                isValidEdad && 
                isValidFecha && 
                isValidGenero && 
                isValidTerminos;
            
            if (!isFormValid) {
                console.log('❌ Formulario inválido - Revisa los errores');
                alert('Por favor, corrige los errores antes de enviar el formulario.');
                return;
            }
            
            // Si todo está bien, mostrar éxito
            console.log('✅ Formulario válido - Procesando envío...');
            mostrarExito();
        });

        /*
            FUNCIÓN PARA MOSTRAR EL MENSAJE DE ÉXITO
            Muestra un resumen de los datos ingresados
        */
        function mostrarExito() {
            // Obtener el género seleccionado
            let generoSeleccionado = '';
            for (let radio of generoRadios) {
                if (radio.checked) {
                    generoSeleccionado = radio.value;
                    break;
                }
            }
            
            // Crear resumen de datos
            const resumenHTML = `
                <p><strong>Nombre:</strong> ${nombre.value}</p>
                <p><strong>Dirección:</strong> ${direccion.value}</p>
                <p><strong>Email:</strong> ${email.value}</p>
                <p><strong>Edad:</strong> ${edad.value} años</p>
                <p><strong>Fecha de Nacimiento:</strong> ${fechaNacimiento.value}</p>
                <p><strong>Género:</strong> ${generoSeleccionado}</p>
                <p><strong>Newsletter:</strong> ${document.getElementById('newsletter').checked ? 'Sí' : 'No'}</p>
            `;
            
            dataSummary.innerHTML = resumenHTML;
            successMessage.style.display = 'block';
            
            // Desplazar al mensaje de éxito
            successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Deshabilitar el formulario
            const inputs = form.querySelectorAll('input, button');
            inputs.forEach(input => input.disabled = true);
            
            // Mostrar datos en consola
            console.log('📋 Datos del formulario:');
            console.log('Nombre:', nombre.value);
            console.log('Dirección:', direccion.value);
            console.log('Email:', email.value);
            console.log('Edad:', edad.value);
            console.log('Fecha de Nacimiento:', fechaNacimiento.value);
            console.log('Género:', generoSeleccionado);
            console.log('Términos aceptados:', terminos.checked);
            console.log('Newsletter:', document.getElementById('newsletter').checked);
            
            alert('✅ Formulario enviado con éxito');
        }

        // Inicialización
        console.log('📝 Formulario de registro inicializado');
        console.log('🛡️ Validaciones activas:');
        console.log('  - HTML5: required, minlength, type, max, min');
        console.log('  - JavaScript: coincidencia de contraseñas, formato, edad mínima');
    </script>
</body>
</html>
